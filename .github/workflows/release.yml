name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  electron:
    name: Electron installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm --filter @we/electron test

      - name: Build installer
        run: pnpm --filter @we/electron package:win

      - name: Collect installers
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace "^v", ""
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item apps/electron/release/*.msi "artifacts/WorkEncourager-Electron-Setup-$ver.msi"
          Copy-Item apps/electron/release/*.zip "artifacts/WorkEncourager-Electron-$ver.zip"
          Get-ChildItem artifacts | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: electron-windows
          if-no-files-found: error
          path: artifacts/*

  tauri:
    name: Tauri installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm --filter @we/tauri test

      - name: Build installer
        run: pnpm --filter @we/tauri build

      - name: Collect installers
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace "^v", ""
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item apps/tauri/src-tauri/target/release/bundle/msi/*.msi "artifacts/WorkEncourager-Tauri-Setup-$ver.msi"
          Get-ChildItem artifacts | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          if-no-files-found: error
          path: artifacts/*

  slint:
    name: Slint portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/slint

      - name: Build portable exe
        run: cargo build --release --manifest-path apps/slint/Cargo.toml

      - name: Collect installers
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace "^v", ""
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item apps/slint/target/release/work-encourager-slint.exe "artifacts/WorkEncourager-Slint-$ver.exe"
          Get-ChildItem artifacts | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: slint-windows
          if-no-files-found: error
          path: artifacts/*

  publish:
    name: Publish release
    needs: [electron, tauri, slint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect installers
        run: |
          mkdir -p assets
          find dist -type f \( -name '*.msi' -o -name '*.zip' -o -name '*.exe' \) -exec cp {} assets/ \;
          ls -lh assets

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
